<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hay algo en el maizal</title>
  <style>
    /* =====================================================================
     * SISTEMA DE DISEÑO
     * Dos letras: la de píxel (títulos, botones, etiquetas y teclas) y la de lectura (todo lo que es una frase).
     * Los mismos valores viven en game.js (objeto UI) para lo que se dibuja en el lienzo.
     * ===================================================================== */
    @font-face { font-family: "Silkscreen"; src: url("fonts/silkscreen-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-400-italic.woff2") format("woff2"); font-style: italic; font-display: swap; }

    :root {
      color-scheme: dark;
      /* Letras */
      --font-pixel: "Silkscreen", "Courier New", monospace;
      --font-text: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
      --fs-px-xs: 11px;                                 /* etiquetas, teclas, nombres */
      --fs-px-sm: 14px;                                 /* botones */
      --fs-px-md: 24px;                                 /* números grandes */
      --fs-px-lg: clamp(22px, 3.2vw, 32px);             /* títulos de panel */
      --fs-px-xl: clamp(30px, 6.4vw, 62px);             /* título del juego */
      --fs-tx-sm: 13px;                                 /* ayudas */
      --fs-tx-md: 15px;                                 /* opciones, diario */
      --fs-tx-lg: clamp(15px, 1.9vw, 18px);             /* diálogo, historia */
      /* Colores */
      --bg-page: #05080f;
      --bg-overlay: rgba(2, 4, 8, .86);                 /* paneles a pantalla completa */
      --bg-panel: rgba(7, 11, 19, .94);                 /* cajas */
      --bg-ctl: #0f1928;                                /* controles */
      --bg-ctl-hi: #17263b;
      --line: #2a3d57;
      --line-hi: #4d6b8f;
      --fg: #e8eef7;
      --fg-dim: #9aabc2;
      --fg-mute: #5d6e86;
      --acc: #b9f66d;                                   /* el verde del maizal: lo principal */
      --gold: #ffe08a;                                  /* lo que puedes hacer ahora */
      --warn: #ffb347;
      --danger: #ff5b68;
      /* Forma */
      --bw: 2px;
      --shadow: 4px 4px 0 rgba(0, 0, 0, .65);
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
      --btn-w: 232px;                                   /* todos los botones miden lo mismo */
      --btn-h: 44px;
      --opt-h: 34px;                                    /* opciones de diálogo */
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #101c2e 0%, var(--bg-page) 72%);
      color: var(--fg); font-family: var(--font-text);
    }
    .wrap { width: min(100%, 1000px); padding: var(--sp-4); text-align: center; }
    .stage { position: relative; border: var(--bw) solid var(--line); overflow: hidden; box-shadow: var(--shadow), 0 0 40px #000; background: #000; }
    #view { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .hidden { display: none !important; }

    /* ---------- Tipografía ---------- */
    .t-display { font-family: var(--font-pixel); font-weight: 400; font-size: var(--fs-px-xl); line-height: 1.1; color: var(--acc); letter-spacing: .04em;
      text-shadow: 3px 3px 0 #10240f, 0 0 24px rgba(120, 220, 90, .45); }
    .t-title { font-family: var(--font-pixel); font-weight: 400; font-size: var(--fs-px-lg); line-height: 1.4; color: var(--fg); letter-spacing: .06em; }
    .t-label { font-family: var(--font-pixel); font-size: var(--fs-px-xs); line-height: 1.6; color: var(--fg-dim); letter-spacing: .08em; text-transform: uppercase; }
    .t-body { font-family: var(--font-text); font-size: var(--fs-tx-lg); line-height: 1.6; color: var(--fg); white-space: pre-line; }
    kbd { display: inline-block; font-family: var(--font-pixel); font-size: var(--fs-px-xs); line-height: 1; padding: 4px 5px;
      color: var(--fg); background: var(--bg-ctl); border: var(--bw) solid var(--line-hi); }

    /* ---------- Botón: uno solo para todo el juego ---------- */
    button { font: inherit; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
      width: var(--btn-w); height: var(--btn-h); padding: 0 var(--sp-4); margin: 0;
      font-family: var(--font-pixel); font-weight: 400; font-size: var(--fs-px-sm); letter-spacing: .04em; text-transform: uppercase;
      color: var(--fg); background: var(--bg-ctl); border: var(--bw) solid var(--line-hi); border-radius: 0;
      box-shadow: var(--shadow); cursor: pointer; transition: color .12s, background .12s, border-color .12s, transform .06s, box-shadow .06s;
    }
    .btn:hover:not(:disabled), .btn:focus-visible { color: var(--acc); background: var(--bg-ctl-hi); border-color: var(--acc); outline: none; }
    .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .65); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-primary { color: var(--acc); border-color: var(--acc); }
    .btn-ghost { color: var(--fg-dim); background: transparent; border-color: var(--line); }

    /* ---------- Disposición ---------- */
    .stack { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); }

    /* ---------- Paneles ---------- */
    .panel { position: absolute; color: var(--fg); text-align: left; }
    .panel.full {                                       /* intro, pausa, final: todo centrado, mismo orden */
      inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: var(--sp-5);
      padding: 7% 10%; text-align: center; overflow-y: auto; background: var(--bg-overlay);
    }
    .panel.full .t-body { max-width: 640px; margin: 0; }
    .card {                                             /* diario, historial */
      background: var(--bg-panel); border: var(--bw) solid var(--line); box-shadow: var(--shadow); padding: var(--sp-5);
      font-family: var(--font-text); font-size: var(--fs-tx-md); line-height: 1.55;
    }
    #diary { left: 10%; right: 10%; top: 12%; max-height: 76%; overflow-y: auto; }
    #diary div:first-child { font-family: var(--font-pixel); font-size: var(--fs-px-xs) !important; letter-spacing: .08em; text-transform: uppercase; }

    /* ---------- Menú de inicio ---------- */
    .panel.menu { background: radial-gradient(ellipse at center, rgba(2, 6, 12, .4) 0%, rgba(0, 0, 0, .92) 78%); overflow: hidden; }
    .menu-inner { position: relative; z-index: 2; gap: var(--sp-6); }
    .menu-title { animation: flick 6s infinite; }
    #levelList { display: grid; grid-template-columns: repeat(2, var(--btn-w)); gap: var(--sp-2) var(--sp-3); }   /* 2 × 2: no empuja el menú hacia abajo */
    #levelList.hidden { display: none; }
    #menuEyes { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .eyes { position: absolute; width: 26px; height: 6px; opacity: 0; animation: blink linear infinite; }
    .eyes::before, .eyes::after { content: ""; position: absolute; top: 0; width: 5px; height: 5px; background: #ff2a3a; box-shadow: 0 0 8px 3px #ff2a3a; }
    .eyes::before { left: 0; } .eyes::after { right: 0; }
    @keyframes blink { 0%, 62% { opacity: 0; } 64%, 66% { opacity: .95; } 67% { opacity: 0; } 69%, 80% { opacity: .85; } 82%, 100% { opacity: 0; } }
    @keyframes flick { 0%, 90%, 100% { opacity: 1; } 91% { opacity: .25; } 92% { opacity: 1; } 94% { opacity: .5; } 95% { opacity: 1; } }

    /* ---------- Pausa ---------- */
    .vol { display: flex; align-items: center; gap: var(--sp-3); }
    .vol input { width: 150px; accent-color: var(--acc); }
    .vol span { min-width: 4ch; text-align: right; color: var(--fg); }

    /* ---------- Final ---------- */
    #endTitle.win { color: var(--acc); }
    #endTitle.lose { color: var(--danger); }
    #end.win-end, #end.lose-end { background: rgba(0, 0, 0, .62); justify-content: flex-end; padding-bottom: 5%; }

    /* ---------- Diálogo (bar, persecución, maizal y final) ---------- */
    #talk {
      position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-4) 4% var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2);
      text-align: left; font-family: var(--font-text); pointer-events: none;
      background: linear-gradient(to top, rgba(3, 6, 12, .94) 0%, rgba(3, 6, 12, .72) 60%, rgba(3, 6, 12, 0) 100%);
    }
    #talk > * { pointer-events: auto; }
    #talkHead { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    #talkHead:empty { display: none; }
    #talkHead .h-name, #talkHead .h-place { display: none; }
    #talkHead .chip { font-family: var(--font-pixel); font-size: var(--fs-px-xs); letter-spacing: .06em; padding: 4px 8px; border: var(--bw) solid currentColor; background: var(--bg-panel); }
    #talkHead .chip.ok { color: var(--acc); } #talkHead .chip.mid { color: var(--gold); }
    #talkHead .chip.bad { color: var(--danger); } #talkHead .chip.neu { color: var(--fg-dim); } #talkHead .chip.ear { color: var(--warn); }
    #talkCtx, #talkFoot { display: none !important; }
    .talk-box {
      --acc-who: var(--fg-dim); position: relative; margin-top: var(--sp-2); padding: var(--sp-3) var(--sp-4); min-height: 56px; cursor: pointer;
      background: var(--bg-panel); border: var(--bw) solid var(--line); border-left: 6px solid var(--acc-who); box-shadow: var(--shadow);
    }
    .talk-box.fade { animation: lineIn .2s ease-out; }
    #talkWho {
      position: absolute; top: -11px; left: var(--sp-3); padding: 4px 8px;
      font-family: var(--font-pixel); font-size: var(--fs-px-xs); letter-spacing: .06em; text-transform: uppercase;
      color: var(--acc-who); background: var(--bg-page); border: var(--bw) solid var(--acc-who);
    }
    #talkLine { font-size: var(--fs-tx-lg); line-height: 1.45; color: var(--fg); }
    .talk-box.narr { background: transparent; border-color: transparent; box-shadow: none; }
    .talk-box.narr #talkWho { display: none; }
    .talk-box.narr #talkLine { color: var(--fg-dim); font-style: italic; text-align: center; }
    #talkNext { position: absolute; right: var(--sp-3); bottom: var(--sp-1); font-family: var(--font-pixel); font-size: var(--fs-px-xs); color: var(--acc-who); animation: nudge 1s ease-in-out infinite; }
    #talkPortrait { display: none; position: absolute; left: var(--sp-3); top: 50%; transform: translateY(-50%); width: 40px; height: 40px;
      image-rendering: pixelated; border: var(--bw) solid var(--acc-who); background: var(--bg-ctl); }
    .talk-box.has-portrait { padding-left: 66px; }
    .talk-box.has-portrait #talkPortrait { display: block; }
    .talk-box.has-portrait #talkWho { left: 60px; }
    /* Opciones: todas del mismo alto, en dos columnas */
    #talkOpts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1) var(--sp-2); }
    #talkOpts:empty { display: none; }
    /* Cada opción: [tecla] [etiqueta arriba / frase abajo] [costo]. Mismo esquema en todas, con o sin etiqueta */
    .opt {
      display: grid; grid-template-columns: 22px 1fr auto; grid-template-areas: "k tag cost" "k t cost"; align-items: center; column-gap: var(--sp-3); row-gap: 2px;
      width: 100%; min-height: var(--opt-h); margin: 0; padding: var(--sp-2) var(--sp-3);
      text-align: left; font-family: var(--font-text); font-size: var(--fs-tx-md); line-height: 1.3; color: var(--fg); cursor: pointer;
      background: var(--bg-panel); border: var(--bw) solid var(--line); border-radius: 0;
      animation: optIn .22s ease-out both; transition: background .12s, border-color .12s, transform .12s;
    }
    .opt:hover, .opt:focus-visible { background: var(--bg-ctl-hi); border-color: var(--acc); transform: translateX(3px); outline: none; }
    .opt .k { grid-area: k; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
      font-family: var(--font-pixel); font-size: var(--fs-px-xs); color: var(--fg); background: var(--bg-ctl); border: var(--bw) solid var(--line-hi); }
    .opt .tag { grid-area: tag; font-family: var(--font-pixel); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-dim); }
    .opt .tag:empty { display: none; }
    .opt .t { grid-area: t; }
    .opt .cost { grid-area: cost; font-family: var(--font-text); font-weight: 700; font-size: var(--fs-tx-sm); color: var(--warn); white-space: nowrap; }
    .opt.hard { border-color: #6a3a24; }
    .opt.leave { background: transparent; border-color: transparent; color: var(--fg-dim); }
    .opt.used { opacity: .3; cursor: default; transform: none !important; }
    #talkLog { position: absolute; top: 5%; bottom: 5%; left: 8%; right: 8%; overflow-y: auto; text-align: left; cursor: pointer; }
    #talkLog .log-title { font-family: var(--font-pixel); font-size: var(--fs-px-xs); color: var(--acc); letter-spacing: .08em; text-transform: uppercase; margin-bottom: var(--sp-3); }
    #talkLog .log-sep { margin: var(--sp-4) 0 var(--sp-1); font-family: var(--font-pixel); font-size: 11px; color: var(--fg-mute); letter-spacing: .1em; text-transform: uppercase; border-bottom: var(--bw) solid var(--line); padding-bottom: var(--sp-1); }
    #talkLog .log-narr { color: var(--fg-dim); font-style: italic; }
    @keyframes lineIn { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes optIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(3px); opacity: 1; } }

    /* ---------- Reloj: uno solo para todos los niveles (solo cambian el texto y el número) ---------- */
    #clock {
      --p: 1; --c: var(--fg); position: absolute; left: 2.5%; top: 14px; z-index: 5; width: 62px; height: 62px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none;
      background: radial-gradient(circle, rgba(5, 9, 16, .95) 58%, transparent 60%), conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(255, 255, 255, .12) 0);
      box-shadow: 0 0 18px rgba(0, 0, 0, .7);
    }
    .rt-num { font-family: var(--font-text); font-weight: 700; font-size: 22px; color: var(--c); line-height: 1; }
    .rt-lbl, .rt-sub { position: absolute; left: calc(100% + 8px); white-space: nowrap;
      font-family: var(--font-text); font-weight: 700; font-size: 12px; color: var(--c);
      padding: 2px 8px; background: var(--bg-panel); border: var(--bw) solid var(--line); }
    .rt-lbl { top: 6px; }
    .rt-sub { bottom: 6px; }
    #clock.warn { --c: var(--warn); animation: tPulse .65s ease-in-out infinite, tShake .3s linear infinite; }
    #clock.danger { --c: var(--danger); box-shadow: 0 0 26px rgba(255, 40, 60, .55); animation: tBeat .4s ease-in-out infinite, tShakeHard .12s linear infinite; }
    #clock.spend { animation: tSpend .55s ease-out; }
    #clock.warn.spend, #clock.danger.spend { animation: tSpend .55s ease-out, tPulse .65s ease-in-out .55s infinite; }
    #clock .rt-cost { left: calc(100% + 150px); }
    .rt-cost { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; opacity: 0;
      font-family: var(--font-text); font-weight: 700; font-size: 18px; color: var(--danger); text-shadow: 2px 2px 0 #000; }
    .rt-cost.pop { animation: costPop 1.8s ease-out forwards; }
    @keyframes tSpend { 0% { transform: scale(1); filter: brightness(1); } 20% { transform: scale(1.22) rotate(-8deg); filter: brightness(1.8); }
      45% { transform: scale(.94) rotate(5deg); } 70% { transform: scale(1.05) rotate(-2deg); } 100% { transform: scale(1); filter: brightness(1); } }
    @keyframes costPop { 0% { opacity: 0; transform: translate(-6px, -50%); } 12% { opacity: 1; transform: translate(0, -50%); }
      70% { opacity: 1; transform: translate(0, -110%); } 100% { opacity: 0; transform: translate(0, -160%); } }
    @keyframes tPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes tBeat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.18); } 55% { transform: scale(1.04); } }
    @keyframes tShake { 0%, 100% { translate: 0 0; } 25% { translate: -1px 1px; } 75% { translate: 1px -1px; } }
    @keyframes tShakeHard { 0% { translate: 0 0; } 25% { translate: -3px 2px; } 50% { translate: 3px -2px; } 75% { translate: -2px -3px; } 100% { translate: 2px 3px; } }

    /* ---------- Ayuda bajo el juego ---------- */
    .help { margin: var(--sp-4) 0 0; font-family: var(--font-text); font-size: var(--fs-tx-sm); line-height: 2.2; color: var(--fg-dim); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="stage">
      <canvas id="view" aria-label="Hay algo en el maizal, vista en primera persona"></canvas>

      <div id="menu" class="panel full menu">
        <div id="menuEyes"></div>
        <div class="menu-inner stack">
          <div class="menu-title t-display">HAY ALGO<br>EN EL MAIZAL</div>
          <div class="stack">
            <button id="menuBtn" class="btn btn-primary">Entrar</button>
            <button id="levelsBtn" class="btn">Elegir nivel</button>
            <div id="levelList" class="stack hidden">
              <button class="btn btn-ghost" data-lv="1">1 · El bar</button>
              <button class="btn btn-ghost" data-lv="2">2 · La persecución</button>
              <button class="btn btn-ghost" data-lv="3">3 · El maizal</button>
              <button class="btn btn-ghost" data-lv="4">4 · La luz</button>
            </div>
          </div>
        </div>
      </div>

      <div id="intro" class="panel full hidden">
        <p id="introText" class="t-body"></p>
        <button id="introBtn" class="btn btn-primary">Continuar »</button>
      </div>

      <div id="talk" class="hidden compact">
        <div id="talkHead"></div>
        <div id="talkCtx" class="hidden"></div>
        <div id="talkBox" class="talk-box"><canvas id="talkPortrait" width="40" height="40"></canvas><span id="talkWho"></span><div id="talkLine"></div><span id="talkNext" class="hidden">▼</span></div>
        <div id="talkOpts"></div>
        <div id="talkFoot"></div>
      </div>
      <div id="talkLog" class="card hidden"></div>
      <div id="clock" class="hidden"><span id="clockLbl" class="rt-lbl"></span><span id="clockNum" class="rt-num"></span><span id="clockSub" class="rt-sub"></span><span id="clockCost" class="rt-cost"></span></div>

      <div id="diary" class="panel card hidden"></div>

      <div id="pause" class="panel full hidden">
        <div class="t-title">PAUSA</div>
        <div class="stack">
          <button id="pResume" class="btn btn-primary">Continuar</button>
          <button id="pRestart" class="btn">Reiniciar nivel</button>
          <button id="pLevels" class="btn">Elegir nivel</button>
          <button id="pMenu" class="btn btn-ghost">Menú principal</button>
        </div>
        <label class="vol t-label">Volumen <input id="pVol" type="range" min="0" max="100" step="5"> <span id="pVolN"></span></label>
      </div>

      <div id="end" class="panel full hidden">
        <div id="endTitle" class="t-title"></div>
        <p id="endText" class="t-body"></p>
        <div class="row">
          <button id="endNextBtn" class="btn btn-primary hidden">Siguiente »</button>
          <button id="endBtn" class="btn btn-primary">Jugar de nuevo [R]</button>
          <button id="endMenuBtn" class="btn btn-ghost">Volver al inicio</button>
        </div>
      </div>
    </div>

    <p class="help">
      <kbd>MOUSE</kbd> mirar (clic en el juego) · <kbd>W A S D</kbd> moverse · <kbd>E</kbd> hablar o examinar ·
      <kbd>1</kbd>–<kbd>6</kbd> responder · <kbd>ENTER</kbd> continuar · <kbd>H</kbd> lo que se dijo · <kbd>J</kbd> lo que sabes ·
      <kbd>M</kbd> mapa · <kbd>P</kbd>/<kbd>ESC</kbd> pausa
    </p>
  </main>
  <script src="game.js"></script>
  <script src="chase.js"></script>
  <script src="final.js"></script>
</body>
</html>
