<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape del Maizal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #14233a 0%, #050912 72%);
      color: #e8f1ff; font-family: "Courier New", monospace;
    }
    .wrap { width: min(100%, 1000px); padding: 18px; text-align: center; }
    h1 { margin: 0 0 5px; color: #b9e77c; font-size: clamp(22px, 4vw, 34px); letter-spacing: 2px; }
    .subtitle { margin: 0 0 14px; color: #a8bdd9; font-size: 13px; }
    #game { width: 100%; border: 3px solid #304b68; border-radius: 8px; overflow: hidden; box-shadow: 0 0 35px #000b; }
    #game canvas { display: block; width: 100% !important; height: auto !important; image-rendering: pixelated; }
    .help { margin: 12px 0 0; color: #bdcce0; font-size: 13px; line-height: 1.6; }
    kbd { padding: 2px 6px; border: 1px solid #607995; border-radius: 4px; background: #15263b; color: #fff; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ESCAPE DEL MAIZAL</h1>
    <p class="subtitle">Una noche. Un maizal. Algo te está buscando.</p>
    <div id="game" aria-label="Juego Escape del Maizal"></div>
    <p class="help">
      Muévete con <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o las flechas.
      Encuentra la salida luminosa. El alien puede atravesar el maíz y se oculta entre las plantas.
      Pulsa <kbd>R</kbd> para reiniciar.
    </p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
